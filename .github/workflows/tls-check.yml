name: tls-check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Show the certificate chain served by raw.githubusercontent.com
        run: |
          echo | openssl s_client -connect raw.githubusercontent.com:443 -servername raw.githubusercontent.com -showcerts 2>/dev/null > /tmp/chain.txt
          awk '/BEGIN CERTIFICATE/{n++} n>0{print > ("/tmp/c" n ".pem")}' /tmp/chain.txt
          for f in /tmp/c[0-9]*.pem; do echo "== $f"; openssl x509 -in "$f" -noout -subject -issuer -dates; done
          grep -E "Verification|Verify return" /tmp/chain.txt || true
